<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Method - Easy Sales V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-12 d-flex flex-column justify-content-center align-items-center text-center">
                <div class="promo-banner mb-5">
                    <h1 class="display-4 fw-bold text-dark">Choose Delivery Method</h1>
                    <p class="lead text-muted">Select how you'd like to receive your order</p>
                    <small class="text-muted">This choice will affect your checkout process</small>
                </div>
                <div class="order-options">
                    <button class="btn btn-primary btn-lg mb-3 w-100" onclick="selectDeliveryMethod('delivery')">
                        <i class="bi bi-truck me-2"></i>Delivery
                    </button>
                    <button class="btn btn-primary btn-lg w-100" onclick="selectDeliveryMethod('pickup')">
                        <i class="bi bi-shop me-2"></i>Own Collect
                    </button>
                </div>
                <div class="mt-4">
                    <button class="btn btn-secondary" onclick="navigateToPage('index.html')">
                        <i class="bi bi-arrow-left me-2"></i>Back to Home
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        function selectDeliveryMethod(method) {
            // Store the delivery method in sessionStorage
            sessionStorage.setItem('deliveryMethod', method);
            
            // Navigate to products page
            navigateToPage('products.html');
        }
    </script>
</body>
</html>
