<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Service Ordering Kiosk - Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <button class="btn btn-secondary mb-3" onclick="goBackToProducts()">
                    <i class="bi bi-arrow-left me-2"></i>Back to Products
                </button>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="product-image-large mb-3">
                    <img id="productImage" src="" alt="" class="img-fluid rounded">
                </div>
            </div>
            
            <div class="col-md-6">
                <h2 id="productName"></h2>
                <div id="pwpIndicator" style="display: none;">
                    <span class="badge bg-warning text-dark fs-6">PWP Available</span>
                </div>
                <h3 class="text-success" id="productPrice"></h3>
                <div id="pwpPriceSection" style="display: none;">
                    <h4 class="text-warning">
                        <i class="bi bi-tag me-2"></i>PWP Price: <span id="pwpPrice"></span>
                    </h4>
                </div>
                <p class="text-muted" id="productDescription"></p>
                
                <div class="mb-4">
                    <h5>Variations</h5>
                    <div id="productVariations" class="variation-options">
                        <!-- Variations will be dynamically added here -->
                    </div>
                </div>
                
                <div class="mb-4" id="pwpOptionSection" style="display: none;">
                    <h5>Pricing Option</h5>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="pricingOption" id="regularPrice" value="regular" checked>
                        <label class="form-check-label" for="regularPrice">
                            <strong>Regular Price:</strong> RM <span id="regularPriceDisplay"></span>
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="pricingOption" id="pwpPriceOption" value="pwp">
                        <label class="form-check-label" for="pwpPriceOption">
                            <strong>PWP Price:</strong> RM <span id="pwpPriceDisplay"></span>
                            <small class="text-success ms-2">(Purchase with Purchase)</small>
                        </label>
                    </div>
                </div>
                
                <div class="mb-4">
                    <h5>Quantity</h5>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="decreaseQuantity()">
                            <i class="bi bi-dash"></i>
                        </button>
                        <span class="quantity-display" id="quantityDisplay">1</span>
                        <button class="quantity-btn" onclick="increaseQuantity()">
                            <i class="bi bi-plus"></i>
                        </button>
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-lg" onclick="addToCartFromDetails()">
                        <i class="bi bi-cart-plus me-2"></i>Add to Cart
                    </button>
                    <button class="btn btn-success" onclick="showCart()">
                        <i class="bi bi-cart3 me-2"></i>View Cart
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/product-details.js"></script>
</body>
</html>
