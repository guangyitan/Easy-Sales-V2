<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Service Ordering Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-12 d-flex flex-column justify-content-center align-items-center text-center">
                <div class="promo-banner mb-5">
                    <h1 class="display-4 fw-bold text-dark">Welcome to Abu Hardware</h1>
                    <p class="lead text-muted">Quality Hardware & Manufacturing Materials</p>
                </div>
                <div class="order-options">
                    <button class="btn btn-primary btn-lg mb-3 w-100" onclick="navigateToPage('delivery-method.html')">
                        <i class="bi bi-cart me-2"></i>Start Shopping
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        // Set isPOOrder to false for regular customer flow
        sessionStorage.setItem('isPOOrder', 'false');
        
        // Clear any existing PO-related session data
        sessionStorage.removeItem('selectedPOBranch');
        sessionStorage.removeItem('selectedPOCustomer');
    </script>
</body>
</html>
