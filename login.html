<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Service Ordering Kiosk - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="login-card">
                    <div class="text-center mb-4">
                        <h2>Login or Sign Up</h2>
                        <p class="text-muted">Choose your login method to continue</p>
                    </div>
                    
                    <!-- Login Method Selection -->
                    <div id="loginMethodSelection" class="mb-4">
                        <div class="d-grid gap-3">
                            <button class="btn btn-primary btn-lg" onclick="showLoginMethod('email')">
                                <i class="bi bi-envelope me-2"></i>Login with Email
                            </button>
                            <button class="btn btn-primary btn-lg" onclick="showLoginMethod('phone')">
                                <i class="bi bi-phone me-2"></i>Login with Phone Number
                            </button>
                            <button class="btn btn-secondary btn-lg" onclick="goBackToCart()">
                                <i class="bi bi-arrow-left me-2"></i>Back to Cart
                            </button>
                        </div>
                    </div>
                    
                    <!-- Email Login Form -->
                    <div id="emailLoginForm" class="login-form" style="display: none;">
                        <h4 class="mb-3">Login with Email</h4>
                        <form id="emailLogin">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email address" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-shield-lock me-2"></i>Request OTP
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="showLoginMethodSelection()">
                                    <i class="bi bi-arrow-left me-2"></i>Back
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    <!-- Phone Login Form -->
                    <div id="phoneLoginForm" class="login-form" style="display: none;">
                        <h4 class="mb-3">Login with Phone Number</h4>
                        <form id="phoneLogin">
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phoneNumber" placeholder="+60 12-3456789" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-shield-lock me-2"></i>Request OTP
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="showLoginMethodSelection()">
                                    <i class="bi bi-arrow-left me-2"></i>Back
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    <!-- OTP Verification Form -->
                    <div id="otpForm" class="login-form" style="display: none;">
                        <h4 class="mb-3">Enter OTP</h4>
                        <p class="text-muted mb-3">We've sent a 6-digit code to your <span id="otpTarget"></span></p>
                        <form id="otpVerification">
                            <div class="mb-4">
                                <label for="otpCode" class="form-label">OTP Code</label>
                                <div class="otp-inputs">
                                    <input type="text" class="form-control otp-digit" maxlength="1" required>
                                    <input type="text" class="form-control otp-digit" maxlength="1" required>
                                    <input type="text" class="form-control otp-digit" maxlength="1" required>
                                    <input type="text" class="form-control otp-digit" maxlength="1" required>
                                    <input type="text" class="form-control otp-digit" maxlength="1" required>
                                    <input type="text" class="form-control otp-digit" maxlength="1" required>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="bi bi-check-circle me-2"></i>Verify & Continue
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="resendOTP()">
                                    <i class="bi bi-arrow-clockwise me-2"></i>Resend OTP
                                </button>
                                <button type="button" class="btn btn-outline-secondary" onclick="showLoginMethodSelection()">
                                    <i class="bi bi-arrow-left me-2"></i>Back
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
