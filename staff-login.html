<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Easy Sales V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h2 {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #6c757d;
            margin: 0;
        }
        
        .form-floating {
            margin-bottom: 20px;
        }
        
        .btn-login {
            background-color: var(--primary-color);
            border: none;
            padding: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        
        .staff-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-person-badge staff-icon"></i>
                <h2>Staff Login</h2>
                <p>Click below to access the system</p>
            </div>
            
            <form id="staffLoginForm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="staffUsername" placeholder="Enter Username" value="admin">
                    <label for="staffUsername">
                        <i class="bi bi-person me-2"></i>Username
                    </label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="staffPassword" placeholder="Enter Password" value="123456">
                    <label for="staffPassword">
                        <i class="bi bi-lock me-2"></i>Password
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>
            </form>
            
            <div class="nav flex-column nav-pills">
                <a class="nav-link" href="delivery-method.html">
                    <i class="bi bi-cart me-2"></i>Products
                </a>
                <a class="nav-link" href="sales-order.html">
                    <i class="bi bi-receipt me-2"></i>Sales Orders
                    <small class="d-block text-muted">Terima bayaran pelanggan</small>
                </a>
                <a class="nav-link" href="pending-delivery.html">
                    <i class="bi bi-clock-history me-2"></i>Pending Delivery
                    <small class="d-block text-muted">Susun Penghantaran Stock</small>
                </a>
                <a class="nav-link" href="purchase-order.html">
                    <i class="bi bi-file-earmark-text me-2"></i>Purchase Orders
                    <small class="d-block text-muted">Order stock dari branch lain</small>
                </a>
                <a class="nav-link" href="delivery-fee-management.html">
                    <i class="bi bi-truck me-2"></i>Delivery Fees
                    <small class="d-block text-muted">Manage delivery charges</small>
                </a>
                <hr class="my-3">
                <a class="nav-link text-danger" href="index.html">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('staffLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Simple redirect to sales-order.html
            window.location.href = 'sales-order.html';
        });
    </script>
</body>
</html>
