<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Service Ordering Kiosk - Customer Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Customer Information</h2>
        
        <!-- User Status Display -->
        <div class="alert alert-info mb-4" id="userStatus">
            <i class="bi bi-info-circle me-2"></i>
            <span id="userStatusText">Loading...</span>
        </div>
        
        <!-- Existing Customer Info Display -->
        <div class="card mb-4" id="existingCustomerInfo" style="display: none;">
            <div class="card-header">
                <h5 class="mb-0">Your Information</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <strong>Name:</strong> <span id="displayName"></span>
                    </div>
                    <div class="col-md-6 mb-2">
                        <strong>IC Number:</strong> <span id="displayICNumber"></span>
                    </div>
                    <div class="col-md-6 mb-2">
                        <strong>Email:</strong> <span id="displayEmail"></span>
                    </div>
                    <div class="col-md-6 mb-2">
                        <strong>Phone:</strong> <span id="displayPhone"></span>
                    </div>
                    <div class="col-md-6 mb-2">
                        <strong>Order Type:</strong> <span id="displayOrderType"></span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Edit Customer Information -->
        <div class="card mb-4" id="editCustomerInfo">
            <div class="card-header">
                <h5 class="mb-0">Customer Information</h5>
            </div>
            <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="customerName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="customerName" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="customerPhone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="customerPhone" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="customerEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="customerEmail">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="orderType" class="form-label">Order Type</label>
                    <input type="text" class="form-control" id="orderType" readonly>
                </div>
            </div>
            
            <!-- Address Selection -->
            <div class="mb-3">
                <label class="form-label">Delivery Address</label>
                <div class="mb-2">
                    <button type="button" class="btn btn-outline-primary btn-sm me-2" onclick="addNewAddress()">
                        <i class="bi bi-plus-circle me-1"></i>Add New Address
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="skipAddress()">
                        <i class="bi bi-skip-forward me-1"></i>Skip Address
                    </button>
                </div>
                <div id="addressList">
                    <!-- Addresses will be dynamically added here -->
                </div>
            </div>
            
            <div class="mb-3">
                <label for="customerAddress" class="form-label">Address</label>
                <textarea class="form-control" id="customerAddress" rows="2" placeholder="Enter your address"></textarea>
            </div>
            <div class="mb-3">
                <label for="deliveryAddress" class="form-label">Delivery Address (if different)</label>
                <textarea class="form-control" id="deliveryAddress" rows="2" placeholder="Enter delivery address"></textarea>
            </div>
            <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-secondary" onclick="showCart()">
                    <i class="bi bi-arrow-left me-2"></i>Back to Cart
                </button>
                <button type="submit" class="btn btn-primary" form="customerForm">
                    Proceed to Payment<i class="bi bi-arrow-right ms-2"></i>
                </button>
            </div>
            </div>
        </div>
        
        <form id="customerForm" style="display: none;">
            <!-- Hidden form for submission -->
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/customer-info.js"></script>
</body>
</html>
