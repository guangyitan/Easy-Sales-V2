<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Service Ordering Kiosk - Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Shopping Cart</h2>
        <div id="cartItems" class="mb-4">
            <!-- Cart items will be dynamically added here -->
        </div>
        <div class="row">
            <div class="col-md-8">
                <button class="btn btn-secondary me-2" onclick="navigateToProducts()">
                    <i class="bi bi-arrow-left me-2"></i>Continue Shopping
                </button>
                <button class="btn btn-primary" onclick="navigateToLogin()">
                    Proceed to Checkout<i class="bi bi-arrow-right ms-2"></i>
                </button>
            </div>
            <div class="col-md-4 text-end">
                <h4>Total: RM <span id="cartTotal">0.00</span></h4>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
