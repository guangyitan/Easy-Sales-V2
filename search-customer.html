<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Customer - Easy Sales V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .search-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .search-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }
        
        .search-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .search-header h2 {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .search-header p {
            color: #6c757d;
            margin: 0;
        }
        
        .search-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        
        .form-floating {
            margin-bottom: 20px;
        }
        
        .btn-search {
            background-color: var(--primary-color);
            border: none;
            padding: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-search:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .customer-result {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .customer-result:hover {
            background-color: #f8f9fa;
            border-color: var(--primary-color);
        }
        
        .customer-result.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        
        .po-info {
            background-color: #e8f5e8;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <div class="search-card">
            <div class="search-header">
                <i class="bi bi-person-search search-icon"></i>
                <h2>Search Customer</h2>
                <p>Find customer for this Purchase Order</p>
            </div>
            
            <!-- PO Information Display -->
            <div class="po-info" id="poInfo">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>PO Branch:</strong> <span id="poBranchDisplay"></span>
                    </div>
                    <div>
                        <strong>Delivery Method:</strong> <span id="deliveryMethodDisplay"></span>
                    </div>
                </div>
            </div>
            
            <form id="searchCustomerForm">
                <div class="form-floating">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search by name, phone, or email" required>
                    <label for="searchInput">
                        <i class="bi bi-search me-2"></i>Search Customer
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-search">
                    <i class="bi bi-search me-2"></i>Search Customer
                </button>
            </form>
            
            <!-- Search Results -->
            <div id="searchResults" class="mt-4" style="display: none;">
                <h5>Search Results:</h5>
                <div id="customerList">
                    <!-- Customer results will be added here -->
                </div>
            </div>
            
            <!-- Selected Customer Display -->
            <div id="selectedCustomerDisplay" class="alert alert-success mt-4" style="display: none;">
                <h6><i class="bi bi-check-circle me-2"></i>Selected Customer:</h6>
                <div id="selectedCustomerInfo"></div>
                <button class="btn btn-success mt-3" onclick="proceedToCustomerInfo()">
                    <i class="bi bi-arrow-right me-2"></i>Proceed to Create PO
                </button>
            </div>
            
            <div class="back-link">
                <a href="cart.html">
                    <i class="bi bi-arrow-left me-2"></i>Back to Cart
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        // Mock customer data
        const mockCustomers = [
            { id: 1, name: 'Ahmad bin Ismail', phone: '0123456789', email: 'ahmad@email.com', address: '123 Jalan Merdeka, Masjid Tanah' },
            { id: 2, name: 'Siti Aishah binti Omar', phone: '0198765432', email: 'siti@email.com', address: '456 Jalan Perdana, Alor Gajah' },
            { id: 3, name: 'Mohamed bin Hassan', phone: '0112233445', email: 'mohamed@email.com', address: '789 Jalan Utama, Jasin' },
            { id: 4, name: 'Fatimah binti Ali', phone: '0165566778', email: 'fatimah@email.com', address: '321 Jalan Industri, Sungai Udang' },
            { id: 5, name: 'Razak bin Sulaiman', phone: '0148899001', email: 'razak@email.com', address: '654 Jalan Besar, Merlimau' }
        ];
        
        let selectedCustomer = null;
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Display PO information
            const selectedPOBranch = sessionStorage.getItem('selectedPOBranch');
            const deliveryMethod = sessionStorage.getItem('deliveryMethod');
            
            if (selectedPOBranch) {
                document.getElementById('poBranchDisplay').textContent = selectedPOBranch;
            }
            
            if (deliveryMethod) {
                document.getElementById('deliveryMethodDisplay').textContent = 
                    deliveryMethod === 'delivery' ? 'Delivery' : 'Pickup';
            }
        });
        
        // Search form submission
        document.getElementById('searchCustomerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (!searchTerm) {
                showNotification('Please enter search term', 'warning');
                return;
            }
            
            // Search customers
            const results = mockCustomers.filter(customer => 
                customer.name.toLowerCase().includes(searchTerm) ||
                customer.phone.includes(searchTerm) ||
                customer.email.toLowerCase().includes(searchTerm)
            );
            
            displaySearchResults(results);
        });
        
        function displaySearchResults(results) {
            const searchResults = document.getElementById('searchResults');
            const customerList = document.getElementById('customerList');
            
            if (results.length === 0) {
                customerList.innerHTML = '<p class="text-muted">No customers found</p>';
            } else {
                customerList.innerHTML = results.map(customer => `
                    <div class="customer-result" onclick="selectCustomer(${customer.id})">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="mb-1">${customer.name}</h6>
                                <p class="mb-1"><i class="bi bi-phone me-2"></i>${customer.phone}</p>
                                <p class="mb-1"><i class="bi bi-envelope me-2"></i>${customer.email}</p>
                                <p class="mb-0"><i class="bi bi-geo-alt me-2"></i>${customer.address}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            searchResults.style.display = 'block';
        }
        
        function selectCustomer(customerId) {
            selectedCustomer = mockCustomers.find(c => c.id === customerId);
            
            // Update UI
            document.querySelectorAll('.customer-result').forEach(el => {
                el.classList.remove('selected');
            });
            
            event.target.closest('.customer-result').classList.add('selected');
            
            // Show selected customer display
            const selectedCustomerDisplay = document.getElementById('selectedCustomerDisplay');
            const selectedCustomerInfo = document.getElementById('selectedCustomerInfo');
            
            selectedCustomerInfo.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <strong>Name:</strong> ${selectedCustomer.name}
                    </div>
                    <div class="col-md-6">
                        <strong>Phone:</strong> ${selectedCustomer.phone}
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-6">
                        <strong>Email:</strong> ${selectedCustomer.email}
                    </div>
                    <div class="col-md-6">
                        <strong>Address:</strong> ${selectedCustomer.address}
                    </div>
                </div>
            `;
            
            selectedCustomerDisplay.style.display = 'block';
        }
        
        function proceedToCustomerInfo() {
            if (!selectedCustomer) {
                showNotification('Please select a customer', 'warning');
                return;
            }
            
            // Store selected customer in sessionStorage
            sessionStorage.setItem('selectedPOCustomer', JSON.stringify(selectedCustomer));
            
            // Navigate to customer info page
            navigateToPage('customer-info.html');
        }
    </script>
</body>
</html>
