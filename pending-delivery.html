<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Service Ordering Kiosk - Pending Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="d-flex flex-column h-100">
                    <h4 class="mb-4">Abu Hardware</h4>
                    <div class="nav flex-column nav-pills">
                        <a class="nav-link" href="home.html">
                            <i class="bi bi-house me-2"></i>Back to Home
                        </a>
                        <a class="nav-link" href="sales-order.html">
                            <i class="bi bi-receipt me-2"></i>Sales Orders
                        </a>
                        <a class="nav-link active" href="pending-delivery.html">
                            <i class="bi bi-clock-history me-2"></i>Pending Delivery
                        </a>
                        <a class="nav-link" href="purchase-order.html">
                            <i class="bi bi-file-earmark-text me-2"></i>Purchase Orders
                        </a>
                        <hr class="my-3">
                        <a class="nav-link text-danger" href="staff-login.html">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Pending Delivery</h2>
                    <div class="d-flex gap-2">
                    </div>
                </div>
                
                <!-- Delivery Cards Container -->
                <div class="delivery-cards-container" id="deliveryCardsContainer">
                    <!-- Delivery cards will be dynamically added here -->
                </div>
                
                <!-- Empty State -->
                <div id="emptyState" class="text-center py-5" style="display: none;">
                    <i class="bi bi-truck" style="font-size: 4rem; color: #ccc;"></i>
                    <h4 class="mt-3 text-muted">No Pending Deliveries</h4>
                    <p class="text-muted">All orders have been delivered!</p>
                    <button class="btn btn-primary mt-3" onclick="navigateToPage('home.html')">
                        <i class="bi bi-house me-2"></i>Back to Home
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delivery Details Modal -->
    <div class="modal fade" id="deliveryModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delivery Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="deliveryDetails">
                        <!-- Delivery details will be dynamically added here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success" onclick="generateInvoiceAndDO()">
                        <i class="bi bi-receipt-cutoff me-2"></i>Generate Invoice & DO
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pending-delivery.js"></script>
</body>
</html>
