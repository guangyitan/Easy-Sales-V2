<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Service Ordering Kiosk - Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Payment Method</h2>
        <div class="row">
            <div class="col-md-8">
                <div class="payment-options">
                    <div class="form-check form-check-lg mb-3">
                        <input class="form-check-input" type="radio" name="paymentMethod" id="cash" value="cash" checked>
                        <label class="form-check-label" for="cash">
                            <i class="bi bi-cash-coin me-2"></i>Cash
                        </label>
                    </div>
                    <div class="form-check form-check-lg mb-3">
                        <input class="form-check-input" type="radio" name="paymentMethod" id="ewallet" value="ewallet">
                        <label class="form-check-label" for="ewallet">
                            <i class="bi bi-wallet2 me-2"></i>E-Wallet
                        </label>
                    </div>
                    <div class="form-check form-check-lg mb-3">
                        <input class="form-check-input" type="radio" name="paymentMethod" id="creditcard" value="creditcard">
                        <label class="form-check-label" for="creditcard">
                            <i class="bi bi-credit-card me-2"></i>Credit Card
                        </label>
                    </div>
                    <div class="form-check form-check-lg mb-3">
                        <input class="form-check-input" type="radio" name="paymentMethod" id="duitnow" value="duitnow">
                        <label class="form-check-label" for="duitnow">
                            <i class="bi bi-qr-code me-2"></i>DuitNow QR
                        </label>
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-secondary" onclick="navigateToCustomerInfo()">
                        <i class="bi bi-arrow-left me-2"></i>Back
                    </button>
                    <button class="btn btn-success btn-lg" onclick="completeOrder()">
                        Complete Order<i class="bi bi-check-circle ms-2"></i>
                    </button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="order-summary">
                    <h5>Order Summary</h5>
                    <div id="orderSummaryItems"></div>
                    <hr>
                    <h5>Total: RM <span id="orderTotal">0.00</span></h5>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Confirmation Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Order Confirmation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="text-center mb-3">
                        <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="text-center">Order Placed Successfully!</h5>
                    <p class="text-center">Please proceed to the counter to complete payment.</p>
                    <div class="text-center">
                        <strong>Order Number:</strong> <span id="orderNumber"></span>
                    </div>
                    <button class="btn btn-primary w-100 mt-3" onclick="printOrder()">
                        <i class="bi bi-printer me-2"></i>Print Sales Order
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="resetToHome()">New Order</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
