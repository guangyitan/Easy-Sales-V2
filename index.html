<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Service Ordering Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Home Page -->
    <div id="homePage" class="page active">
        <div class="container-fluid h-100">
            <div class="row h-100">
                <div class="col-12 d-flex flex-column justify-content-center align-items-center text-center">
                    <div class="promo-banner mb-5">
                        <h1 class="display-4 fw-bold text-dark">Welcome to Our Store</h1>
                        <p class="lead text-muted">Quality Hardware & Manufacturing Materials</p>
                    </div>
                    <div class="order-options">
                        <button class="btn btn-primary btn-lg mb-3 w-100" onclick="navigateToProducts('delivery')">
                            <i class="bi bi-truck me-2"></i>Delivery
                        </button>
                        <button class="btn btn-primary btn-lg w-100" onclick="navigateToProducts('pickup')">
                            <i class="bi bi-shop me-2"></i>Own Collect
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Products Page -->
    <div id="productsPage" class="page">
        <div class="container-fluid h-100">
            <div class="row h-100">
                <!-- Category Sidebar -->
                <div class="col-md-3 col-lg-2 category-sidebar">
                    <h5 class="mb-3">Categories</h5>
                    <div class="list-group" id="categoryList">
                        <button class="list-group-item list-group-item-action active" onclick="filterProducts('all')">
                            All Products
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="filterProducts('tools')">
                            Tools
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="filterProducts('materials')">
                            Materials
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="filterProducts('safety')">
                            Safety Equipment
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="filterProducts('electronics')">
                            Electronics
                        </button>
                    </div>
                </div>
                
                <!-- Products Grid -->
                <div class="col-md-9 col-lg-10">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2>Products</h2>
                        <button class="btn btn-success" onclick="showCart()">
                            <i class="bi bi-cart3 me-2"></i>View Cart
                            <span class="badge bg-danger" id="cartCount">0</span>
                        </button>
                    </div>
                    <div class="row g-3" id="productsGrid">
                        <!-- Products will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Page -->
    <div id="cartPage" class="page">
        <div class="container">
            <h2 class="mb-4">Shopping Cart</h2>
            <div id="cartItems" class="mb-4">
                <!-- Cart items will be dynamically added here -->
            </div>
            <div class="row">
                <div class="col-md-8">
                    <button class="btn btn-secondary me-2" onclick="navigateToProducts()">
                        <i class="bi bi-arrow-left me-2"></i>Continue Shopping
                    </button>
                    <button class="btn btn-primary" onclick="navigateToCustomerInfo()">
                        Proceed to Checkout<i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </div>
                <div class="col-md-4 text-end">
                    <h4>Total: RM <span id="cartTotal">0.00</span></h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Customer Information Page -->
    <div id="customerPage" class="page">
        <div class="container">
            <h2 class="mb-4">Customer Information</h2>
            <form id="customerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="customerName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="customerName" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="customerPhone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="customerPhone" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="customerEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="customerEmail">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="orderType" class="form-label">Order Type</label>
                        <input type="text" class="form-control" id="orderType" readonly>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="customerAddress" class="form-label">Address</label>
                    <textarea class="form-control" id="customerAddress" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <label for="deliveryAddress" class="form-label">Delivery Address (if different)</label>
                    <textarea class="form-control" id="deliveryAddress" rows="2"></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-secondary" onclick="showCart()">
                        <i class="bi bi-arrow-left me-2"></i>Back to Cart
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Proceed to Payment<i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Payment Page -->
    <div id="paymentPage" class="page">
        <div class="container">
            <h2 class="mb-4">Payment Method</h2>
            <div class="row">
                <div class="col-md-8">
                    <div class="payment-options">
                        <div class="form-check form-check-lg mb-3">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="cash" value="cash" checked>
                            <label class="form-check-label" for="cash">
                                <i class="bi bi-cash-coin me-2"></i>Cash
                            </label>
                        </div>
                        <div class="form-check form-check-lg mb-3">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="ewallet" value="ewallet">
                            <label class="form-check-label" for="ewallet">
                                <i class="bi bi-wallet2 me-2"></i>E-Wallet
                            </label>
                        </div>
                        <div class="form-check form-check-lg mb-3">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="creditcard" value="creditcard">
                            <label class="form-check-label" for="creditcard">
                                <i class="bi bi-credit-card me-2"></i>Credit Card
                            </label>
                        </div>
                        <div class="form-check form-check-lg mb-3">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="duitnow" value="duitnow">
                            <label class="form-check-label" for="duitnow">
                                <i class="bi bi-qr-code me-2"></i>DuitNow QR
                            </label>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button class="btn btn-secondary" onclick="navigateToCustomerInfo()">
                            <i class="bi bi-arrow-left me-2"></i>Back
                        </button>
                        <button class="btn btn-success btn-lg" onclick="completeOrder()">
                            Complete Order<i class="bi bi-check-circle ms-2"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="order-summary">
                        <h5>Order Summary</h5>
                        <div id="orderSummaryItems"></div>
                        <hr>
                        <h5>Total: RM <span id="orderTotal">0.00</span></h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Confirmation Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Order Confirmation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="text-center mb-3">
                        <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="text-center">Order Placed Successfully!</h5>
                    <p class="text-center">Please proceed to the counter to complete payment.</p>
                    <div class="text-center">
                        <strong>Order Number:</strong> <span id="orderNumber"></span>
                    </div>
                    <button class="btn btn-primary w-100 mt-3" onclick="printOrder()">
                        <i class="bi bi-printer me-2"></i>Print Sales Order
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="resetToHome()">New Order</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
